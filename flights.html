<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flights — Kamil Ticket Global</title>
<meta name="description" content="Compare Jakarta (CGK) to Jeddah (JED) flights: Saudia, Garuda Indonesia and Lion Air.">
<meta name="theme-color" content="#3b55c9">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="flights" data-title-key="nav.flights">
<div id="app-header"></div>
<main>
  <div class="container">
    <section class="f-hero">
      <img src="assets/flight-hero.jpg" alt="" fetchpriority="high">
      <div class="txt"><h1 data-i18n="fl.title"></h1><p data-i18n="fl.sub"></p></div>
    </section>
    <div class="f-search" id="search"></div>

    <div class="f-layout">
      <aside class="filter" id="filter" aria-label="Filter"></aside>
      <section>
        <div class="res-head">
          <div>
            <div class="k" data-i18n="fl.departing"></div>
            <div class="route"><span id="routeTxt"></span></div>
            <div class="meta"><span id="dateTxt"></span> &nbsp;•&nbsp; <span id="countTxt"></span></div>
          </div>
          <div class="sort">
            <button class="btn btn-outline btn-sm filter-toggle" id="filterToggle"><i data-icon="grid"></i><span data-i18n="fl.showfilter"></span></button>
            <label for="sortSel" data-i18n="fl.sort"></label>
            <select id="sortSel"></select>
          </div>
        </div>
        <div class="days" id="days"></div>
        <div class="price-note"><i data-icon="power"></i><span data-i18n="fl.pricenote"></span></div>
        <div id="results"></div>
        <p style="font-size:.82rem;color:var(--muted);margin-top:6px" data-i18n="fl.sample"></p>
      </section>
    </div>

    <div class="f-features">
      <div class="trust-item"><span class="trust-ico"><i data-icon="shield"></i></span><div><b data-i18n="fl.f.secure"></b><span data-i18n="fl.f.secure.d"></span></div></div>
      <div class="trust-item"><span class="trust-ico"><i data-icon="tag"></i></span><div><b data-i18n="fl.f.price"></b><span data-i18n="fl.f.price.d"></span></div></div>
      <div class="trust-item"><span class="trust-ico"><i data-icon="headset"></i></span><div><b data-i18n="fl.f.support"></b><span data-i18n="fl.f.support.d"></span></div></div>
      <div class="trust-item"><span class="trust-ico"><i data-icon="calendar"></i></span><div><b data-i18n="fl.f.flex"></b><span data-i18n="fl.f.flex.d"></span></div></div>
    </div>
  </div>
</main>
<div id="app-footer"></div>
<script src="assets/i18n.js"></script>
<script src="assets/core.js"></script>
<script src="assets/flights.js"></script>
</body>
</html>
