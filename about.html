<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kamil Ticket Global</title>
<meta name="description" content="Book Jakarta (CGK) to Jeddah (JED) flights with Saudia, Garuda Indonesia and Lion Air — Kamil Ticket Globalindo.">
<meta name="theme-color" content="#3b55c9">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="about" data-title-key="nav.about">
<div id="app-header"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <div class="copy">
        <span class="pill soft dot" data-i18n="about.tag"></span>
        <h1><span data-i18n="about.h1a"></span><em data-i18n="about.h1b"></em></h1>
        <p data-i18n="about.lead"></p>
      </div>
      <div class="shape"><img src="assets/wing.jpg" alt=""></div>
    </div>
  </section>

  <div class="container">
    <section class="section">
      <div class="about-grid">
        <div class="photo-stack">
          <div class="photo"><img src="assets/plane.jpg" alt="Airplane at the gate" loading="lazy"></div>
          <div class="badge"><i data-icon="plane"></i><span data-i18n="about.badge"></span><span data-icon="arrow-right"></span></div>
        </div>
        <div class="about-copy">
          <span class="pill soft dot" data-i18n="about.who"></span>
          <h2><span data-i18n="about.h2a"></span> <em data-i18n="about.h2b"></em></h2>
          <p data-i18n="about.p1"></p>
          <p data-i18n="about.p2"></p>
          <a class="btn btn-primary btn-sm" href="services.html" style="margin-top:8px"><span data-i18n="about.more"></span><i data-icon="arrow-right"></i></a>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top:70px">
      <div class="mv">
        <div>
          <span class="pill soft dot" data-i18n="about.mv.tag"></span>
          <h2 data-i18n="about.mv.h"></h2>
          <p data-i18n="about.mv.p"></p>
        </div>
        <div><span class="ico-circle"><i data-icon="target"></i></span><h3 data-i18n="about.mission"></h3><p data-i18n="about.mission.p"></p></div>
        <div><span class="ico-circle"><i data-icon="eye"></i></span><h3 data-i18n="about.vision"></h3><p data-i18n="about.vision.p"></p></div>
        <div><span class="ico-circle"><i data-icon="gem"></i></span><h3 data-i18n="about.values"></h3>
          <ul><li data-i18n="about.v1"></li><li data-i18n="about.v2"></li><li data-i18n="about.v3"></li><li data-i18n="about.v4"></li></ul></div>
      </div>
    </section>

    <section class="section" style="padding-top:70px">
      <div class="why">
        <div>
          <span class="pill soft dot" data-i18n="about.why.tag"></span>
          <h2 data-i18n="about.why.h"></h2>
          <p data-i18n="about.why.p"></p>
          <a class="btn btn-outline btn-sm btn-pill" href="flights.html" data-i18n="about.why.btn"></a>
        </div>
        <div class="why-cards">
          <div class="why-card"><span class="ico-circle"><i data-icon="plane"></i></span><h3 data-i18n="about.w1"></h3><p data-i18n="about.w1.p"></p></div>
          <div class="why-card"><span class="ico-circle"><i data-icon="shield"></i></span><h3 data-i18n="about.w2"></h3><p data-i18n="about.w2.p"></p></div>
          <div class="why-card"><span class="ico-circle"><i data-icon="headset"></i></span><h3 data-i18n="about.w3"></h3><p data-i18n="about.w3.p"></p></div>
          <div class="why-card"><span class="ico-circle"><i data-icon="tag"></i></span><h3 data-i18n="about.w4"></h3><p data-i18n="about.w4.p"></p></div>
        </div>
      </div>
    </section>
  </div>
</main>

<div id="app-footer"></div>
<script src="assets/i18n.js"></script>
<script src="assets/core.js"></script>
</body>
</html>
